plugins {
    id 'com.android.application' version '8.2.2'
}

android {
    namespace 'com.fix.hotspot'
    compileSdk 34

    defaultConfig {
        applicationId "com.fix.hotspot"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
